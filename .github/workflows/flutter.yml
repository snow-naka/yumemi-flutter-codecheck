
name: Flutter checks

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  check:
    name: Analyze, test and format
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Show SDK versions
        run: flutter --version

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify generated localization files
        run: |
          flutter gen-l10n

          changes="$(git status --porcelain --untracked-files=all -- lib/l10n)"

          if [ -n "$changes" ]; then
            echo "Localization files are not up to date."
            printf '%s\n' "$changes"
            git diff -- lib/l10n
            exit 1
          fi

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run all tests
        run: flutter test --no-pub --reporter expanded

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

  android-build:
    name: Build Android release APK
    needs: check
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Configure Java for Flutter
        run: flutter config --jdk-dir="$JAVA_HOME"

      - name: Show SDK versions
        run: |
          flutter --version
          java -version

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Android release APK
        run: flutter build apk --release --no-pub

      - name: Generate APK checksum
        working-directory: build/app/outputs/flutter-apk
        run: |
          sha256sum app-release.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh app-release.apk

      - name: Upload verification APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-verification-apk-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
